name: Android Build

# 触发条件
on:
  push:
    branches: [ "main", "master" ] # 当推送到 main 或 master 分支时触发
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页端手动点击运行

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 环境

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境 (Android 编译通常需要 JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 开启 gradle 缓存，加快后续编译速度

      # 3. 赋予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 编译 Debug 版 APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. 上传编译好的 APK 以供下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk # 下载时的压缩包名称
          path: app/build/outputs/apk/debug/app-debug.apk # APK 在项目中的相对路径
