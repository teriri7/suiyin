name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 解决 Node.js 20 弃用警告，强制使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 检查并自动修复 gradlew 权限/缺失问题
      - name: Check and Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Error: gradlew file not found in root directory!"
            echo "Please run 'gradle wrapper' locally and push the files."
            # 尝试在 Runner 环境中应急生成（如果环境支持）
            gradle wrapper || exit 1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
